# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting
"on":
  push:
    branches:
      - main
      - stag

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1.34" # Specify the desired Bun version

      # Step 3: Cache dependencies
      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun
            bun.lockb
          key: ${{ runner.os }}-bun-${{ hashFiles('**/package.json', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Step 4: Install dependencies
      - name: Install Dependencies
        run: bun install

      # Step 5: Set backend URL for build (prod vs stag)
      - name: Set backend URL
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "VITE_BACKEND_URL=${{ secrets.BACKEND_API }}" >> $GITHUB_ENV
          else
            echo "VITE_BACKEND_URL=${{ secrets.STAG_BACKEND_API }}" >> $GITHUB_ENV
          fi

      # Step 5b: Ensure backend URL is set (fail early if secret missing)
      - name: Verify backend URL
        run: |
          if [ -z "${VITE_BACKEND_URL}" ]; then
            echo "::error::VITE_BACKEND_URL is empty. For 'stag' use repo secret STAG_BACKEND_API. For 'main' use BACKEND_API."
            exit 1
          fi
          echo "VITE_BACKEND_URL is set (OK)"

      # Step 6: Build the project (VITE_BACKEND_URL must be set for correct API base URL)
      - name: Build Project
        env:
          VITE_BACKEND_URL: ${{ github.ref == 'refs/heads/main' && secrets.BACKEND_API || secrets.STAG_BACKEND_API }}
        run: bun run build

      # Step 7: Deploy to Firebase Hosting (Production)
      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISHA_CONSULTANCY_APP }}"
          channelId: live
          projectId: disha-consultancy-app
          target: prod

      # Step 8: Deploy to Firebase Hosting (Staging)
      - name: Deploy to Staging
        if: github.ref == 'refs/heads/stag'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISHA_CONSULTANCY_APP }}"
          channelId: live
          projectId: disha-consultancy-app
          target: staging
